name: CI

# Every PR and every push to main runs `verify`. A push to main then DEPLOYS to Fly — before
# 2026-10-29 nothing deployed automatically, and prod drifted 52 commits away from main for three
# months because every release was a hand `fly deploy` from whatever branch was checked out.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploys never overlap and are never cancelled half-way; PR runs cancel superseded ones.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'fly-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate is four jobs aggregated into `verify`, not one job. Separate jobs always ALL run, so one
  # push surfaces every failure instead of only the first. `scripts/verify.sh` stays the local gate.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `npm test` is `jest --coverage`; jest.config.js carries the coverage floor.
      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Verify sitemap generation
        run: |
          test -f docs/sitemap.xml
          test -f docs/robots.txt
          grep -q 'https://campscout.terapak.com/campgrounds' docs/sitemap.xml
          grep -q 'Sitemap:' docs/robots.txt

  # 🔴 `verify` IS THE REQUIRED STATUS CHECK ON main. Keep the job id `verify` and give it NO
  # `name:` — the check name must stay exactly `verify` or every PR blocks waiting for a check
  # that never reports.
  #
  # `if: always()` so this still runs when a dependency FAILED: without it the aggregator would be
  # SKIPPED, and a skipped required check reads as satisfied-or-pending rather than red. Each
  # `needs.<job>.result` is success / failure / cancelled / skipped, and only `success` passes —
  # a cancelled or skipped job must never read as a green gate.
  verify:
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "lint=$LINT  typecheck=$TYPECHECK  test=$TEST  build=$BUILD"
          fail=0
          for pair in "lint:$LINT" "typecheck:$TYPECHECK" "test:$TEST" "build:$BUILD"; do
            name=${pair%%:*}; result=${pair#*:}
            if [ "$result" != "success" ]; then
              echo "::error title=Gate failed::${name} concluded '${result}'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more checks failed - see the individual jobs above."
            exit 1
          fi
          echo "all four checks passed"

  deploy:
    name: deploy → production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pinned, not @master: an unpinned setup-flyctl died transiently on 2026-09-27 in another repo.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # Builds from this clean checkout of main (fly.toml carries the GA4 build arg), so nothing
      # untracked on a laptop can ship.
      # `--build-arg GIT_SHA` stamps the image with `LABEL GH_SHA` (see Dockerfile) so the next step
      # can prove what each machine is actually running.
      - name: fly deploy
        run: flyctl deploy --app campscout --remote-only --build-arg GIT_SHA=${{ github.sha }} --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # DID IT ACTUALLY LAND? `flyctl deploy` exiting 0 means the deploy was ACCEPTED, not that the
      # app runs the new code. Every machine's `image_ref.labels.GH_SHA` must match this commit.
      # Compact form copied from seoplatform-admin's ci.yml; machine STATE is not asserted (a
      # machine on the right commit is fine, one on the wrong commit never is).
      - name: Assert the deploy landed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            JSON="$(flyctl machines list --app campscout --json 2>/dev/null)" || JSON=""
            if [ -n "$JSON" ] && [ "$JSON" != "[]" ] && [ "$JSON" != "null" ]; then
              MISMATCH=0
              while IFS= read -r line; do
                ID="${line%% *}"; SHA="${line##* }"
                if [ "${SHA:0:12}" = "${EXPECTED:0:12}" ]; then
                  echo "  ok $ID on ${SHA:0:12}"
                else
                  echo "  MISMATCH $ID on ${SHA:0:12} - expected ${EXPECTED:0:12}"; MISMATCH=1
                fi
              done <<< "$(printf '%s' "$JSON" | jq -r '.[] | "\(.id) \((.image_ref.labels.GH_SHA) // "unknown")"')"
              [ "$MISMATCH" -eq 0 ] && echo "deploy landed: every machine on ${EXPECTED:0:12}" && exit 0
            fi
            echo "not yet on ${EXPECTED:0:12} (attempt $attempt); waiting"
            sleep 10
          done
          # "Could not determine" is a FAILURE, not a pass: an unverified deploy and a verified one
          # must never share an exit code.
          echo "::error title=Deploy not verified::campscout is not confirmed on ${EXPECTED:0:12} (mismatching machines listed above)."
          exit 1

      - name: smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://campscout.terapak.com/health) && [ "$code" = 200 ] && echo "health 200" && exit 0
            sleep 10
          done
          echo "health check failed after deploy (last status: $code)"; exit 1

      # GA4's Measurement ID is a BUILD arg from fly.toml [build.args]. This job also passes
      # --build-arg GIT_SHA on the command line; if that ever replaced the toml args instead of adding
      # to them, analytics would switch off silently. So prove the live bundle still carries the ID.
      - name: GA4 Measurement ID still in the live bundle
        run: |
          want=$(grep -E '^[[:space:]]*VITE_GA_MEASUREMENT_ID[[:space:]]*=' fly.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$want" ] || { echo "no VITE_GA_MEASUREMENT_ID in fly.toml — nothing to check"; exit 0; }
          js=$(curl -s https://campscout.terapak.com/ | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$js" ] || { echo "::error::could not find the main bundle in the live HTML"; exit 1; }
          curl -s "https://campscout.terapak.com$js" | grep -q "$want" \
            && echo "GA ID $want present in $js" \
            || { echo "::error::GA Measurement ID $want is MISSING from live bundle $js — analytics is off"; exit 1; }
