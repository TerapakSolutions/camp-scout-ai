name: CI

# Every PR and every push to main runs `verify`. A push to main then DEPLOYS to Fly — before
# 2026-10-29 nothing deployed automatically, and prod drifted 52 commits away from main for three
# months because every release was a hand `fly deploy` from whatever branch was checked out.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deploys never overlap and are never cancelled half-way; PR runs cancel superseded ones.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'fly-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate is four jobs aggregated into `verify`, not one job. Separate jobs always ALL run, so one
  # push surfaces every failure instead of only the first. `scripts/verify.sh` stays the local gate.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `npm test` is `jest --coverage`; jest.config.js carries the coverage floor.
      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Verify sitemap generation
        run: |
          test -f docs/sitemap.xml
          test -f docs/robots.txt
          grep -q 'https://campscout.terapak.com/campgrounds' docs/sitemap.xml
          grep -q 'Sitemap:' docs/robots.txt

  # Cypress e2e against the PRODUCTION server (the artifact Fly ships: `build:fly` + server/production.mjs),
  # signed in via a cookie minted with the app's real signSession (see cypress.config.js).
  # NON-BLOCKING for now: deliberately NOT in `verify.needs`, and deliberately NO `continue-on-error` —
  # that would paint a failing run green. A red e2e shows red on the PR but blocks neither merge nor
  # deploy, because `verify` is the only required check. Promote it into `verify.needs` once it has
  # been green for a while.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # e2e-only dummy: signs the test session cookie; shared by the server and Cypress. Not a real secret.
      SESSION_SECRET: e2e-only-session-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Plain `npm ci` installs the Cypress binary (nothing in this repo sets CYPRESS_INSTALL_BINARY=0).
      - name: Install dependencies
        run: npm ci
      - name: Verify Cypress binary
        run: npx cypress verify
      # build:fly = base '/', out dir dist/ — what the Dockerfile builds. Plain `build` uses the
      # /camp-scout-ai/ base and the routes would not match.
      - name: Build (Fly flavour)
        run: npm run build:fly
      - name: Start production server
        env:
          PORT: '5173'
          DATABASE_PATH: ${{ runner.temp }}/campscout-e2e.sqlite
        run: |
          nohup npx tsx server/production.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5173/health && echo "server up" && exit 0
            sleep 1
          done
          echo "::error::server did not answer /health within 30s"; cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Cypress run
        run: npx cypress run --browser electron
      - name: Upload Cypress screenshots, videos and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore
          retention-days: 7

  # 🔴 `verify` IS THE REQUIRED STATUS CHECK ON main. Keep the job id `verify` and give it NO
  # `name:` — the check name must stay exactly `verify` or every PR blocks waiting for a check
  # that never reports.
  #
  # `if: always()` so this still runs when a dependency FAILED: without it the aggregator would be
  # SKIPPED, and a skipped required check reads as satisfied-or-pending rather than red. Each
  # `needs.<job>.result` is success / failure / cancelled / skipped, and only `success` passes —
  # a cancelled or skipped job must never read as a green gate.
  verify:
    if: always()
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    env:
      LINT: ${{ needs.lint.result }}
      TYPECHECK: ${{ needs.typecheck.result }}
      TEST: ${{ needs.test.result }}
      BUILD: ${{ needs.build.result }}
    timeout-minutes: 5
    steps:
      - name: Gate
        run: |
          echo "lint=$LINT  typecheck=$TYPECHECK  test=$TEST  build=$BUILD"
          fail=0
          for pair in "lint:$LINT" "typecheck:$TYPECHECK" "test:$TEST" "build:$BUILD"; do
            name=${pair%%:*}; result=${pair#*:}
            if [ "$result" != "success" ]; then
              echo "::error title=Gate failed::${name} concluded '${result}'"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more checks failed - see the individual jobs above."
            exit 1
          fi
          echo "all four checks passed"

      # Only on main: there a red gate means a merged commit was NOT deployed. On a PR the red tick
      # is the signal, and alerting on every PR would teach the channel to ignore this.
      - name: Say so if the gate failed on main
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # A REPOSITORY secret on camp-scout-ai (set 2026-10-30). It shadows the TerapakSolutions org
          # secret of the same name, which is private-repos-only and so invisible to this public repo.
          SLACK_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: |
          bash scripts/ci/slack-alert.sh ":rotating_light: CampScout CI gate FAILED on main — nothing deployed" \
            ":rotating_light: *CampScout CI gate FAILED on \`main\`* — the deploy was skipped, so the merged commit is NOT live; campscout.terapak.com still serves the last good release.\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run> · commit \`${GITHUB_SHA:0:7}\` · lint \`${LINT}\` · typecheck \`${TYPECHECK}\` · test \`${TEST}\` · build \`${BUILD}\`"

  deploy:
    name: deploy → production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Pinned, not @master: an unpinned setup-flyctl died transiently on 2026-09-27 in another repo.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # Builds from this clean checkout of main (fly.toml carries the GA4 build arg), so nothing
      # untracked on a laptop can ship.
      # flyctl stamps the image with GH_SHA (= github.sha) itself when it builds inside Actions — verified
      # 10-30 on machine 7812323a220e38 — so no --build-arg is needed for the landed check below.
      # Step timeout < the job's 20 min: a step that times out FAILS (and the Slack step below fires);
      # a job that times out is CANCELLED, and `if: failure()` steps never run on cancellation.
      - name: fly deploy
        timeout-minutes: 15
        run: flyctl deploy --app campscout --remote-only --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # DID IT ACTUALLY LAND? `flyctl deploy` exiting 0 means the deploy was ACCEPTED, not that the
      # app runs the new code. Every machine's `image_ref.labels.GH_SHA` must match this commit.
      # Compact form copied from seoplatform-admin's ci.yml; machine STATE is not asserted (a
      # machine on the right commit is fine, one on the wrong commit never is).
      - name: Assert the deploy landed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            JSON="$(flyctl machines list --app campscout --json 2>/dev/null)" || JSON=""
            if [ -n "$JSON" ] && [ "$JSON" != "[]" ] && [ "$JSON" != "null" ]; then
              MISMATCH=0
              while IFS= read -r line; do
                ID="${line%% *}"; SHA="${line##* }"
                if [ "${SHA:0:12}" = "${EXPECTED:0:12}" ]; then
                  echo "  ok $ID on ${SHA:0:12}"
                else
                  echo "  MISMATCH $ID on ${SHA:0:12} - expected ${EXPECTED:0:12}"; MISMATCH=1
                fi
              done <<< "$(printf '%s' "$JSON" | jq -r '.[] | "\(.id) \((.image_ref.labels.GH_SHA) // "unknown")"')"
              [ "$MISMATCH" -eq 0 ] && echo "deploy landed: every machine on ${EXPECTED:0:12}" && exit 0
            fi
            echo "not yet on ${EXPECTED:0:12} (attempt $attempt); waiting"
            sleep 10
          done
          # "Could not determine" is a FAILURE, not a pass: an unverified deploy and a verified one
          # must never share an exit code.
          echo "::error title=Deploy not verified::campscout is not confirmed on ${EXPECTED:0:12} (mismatching machines listed above)."
          exit 1

      # /health/ready, not /health: proves the DB opens and answers and the watcher is running, not just
      # that the process serves HTTP. Safe right after boot: before the first tick the watcher is judged
      # from its start time, so a fresh machine reads ready (src/server/health/readiness.ts).
      - name: smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' https://campscout.terapak.com/health/ready) && [ "$code" = 200 ] && echo "ready 200: $(cat /tmp/ready.json)" && exit 0
            sleep 10
          done
          echo "readiness check failed after deploy (last status: $code, body: $(cat /tmp/ready.json 2>/dev/null))"; exit 1

      # GA4's Measurement ID is a BUILD arg from fly.toml [build.args]: if a build ever lost it, analytics
      # would switch off silently (no error anywhere). So prove the live bundle still carries the ID.
      - name: GA4 Measurement ID still in the live bundle
        run: |
          want=$(grep -E '^[[:space:]]*VITE_GA_MEASUREMENT_ID[[:space:]]*=' fly.toml | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$want" ] || { echo "no VITE_GA_MEASUREMENT_ID in fly.toml — nothing to check"; exit 0; }
          js=$(curl -s https://campscout.terapak.com/ | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          [ -n "$js" ] || { echo "::error::could not find the main bundle in the live HTML"; exit 1; }
          curl -s "https://campscout.terapak.com$js" | grep -q "$want" \
            && echo "GA ID $want present in $js" \
            || { echo "::error::GA Measurement ID $want is MISSING from live bundle $js — analytics is off"; exit 1; }

      # Last, so it sees every step above: the flyctl deploy, the landed assert, the readiness smoke
      # check and the GA tripwire. Each failure means something different, so the message names them.
      - name: Say so if the deploy failed
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: |
          bash scripts/ci/slack-alert.sh ":rotating_light: CampScout production deploy FAILED" \
            ":rotating_light: *CampScout production deploy FAILED* (commit \`${GITHUB_SHA:0:7}\`).\nIf \`fly deploy\` or the landed assert failed, prod may be on the OLD commit (or split). If only the readiness smoke check failed, the new code IS live but \`/health/ready\` is not 200: its body in the log names \`db\` or \`watcher\`. If only the GA tripwire failed, the site is up but analytics is off.\n<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run>"
