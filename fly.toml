# Fly.io app for https://campscout.terapak.com/
# Deploy: fly deploy
# Secrets:
#   fly secrets set CAMP_SCOUT_API_TOKEN=...
#   fly secrets set AI_ENABLED=true OPENAI_ANSWER_PROVIDER=openai OPENAI_API_KEY=... OPENAI_MODEL=gpt-4o-mini
#   fly secrets set STRIPE_SECRET_KEY=... STRIPE_PUBLISHABLE_KEY=... STRIPE_PRICE_5=... STRIPE_PRICE_10=... STRIPE_PRICE_25=...
#   fly secrets set APP_URL=https://campscout.terapak.com
#   Availability watcher (SMS alerts): fly secrets set TWILIO_ACCOUNT_SID=... TWILIO_AUTH_TOKEN=... TWILIO_FROM_NUMBER=+1...

app = 'campscout'
primary_region = 'sjc'

[build]
  [build.args]
    # GA4 Measurement ID for the "Campscout" property (analytics.google.com).
    # Public (ships in the page), so committing it is fine. Empty = analytics off.
    VITE_GA_MEASUREMENT_ID = "G-8SX4QP18MW"

[env]
  NODE_ENV = 'production'
  # AI is configured entirely via SECRETS, which override [env] at runtime — do NOT
  # re-add AI_ENABLED / OPENAI_ANSWER_PROVIDER / AI_DAILY_BUDGET_USD here. They used
  # to sit in [env] as 'false'/'fake'/'5' while the secrets said true/openai/1.00, so
  # this file lied about the live state (misdiagnosed 2026-07-21). `fly secrets list`
  # is the source of truth. Live guardrails: AI_ENABLED=true, provider=openai,
  # AI_DAILY_BUDGET_USD=1.00, AI_MAX_REQUEST_COST_USD=0.01, AI_MAX_PROMPT_TOKENS=2500,
  # OPENAI_MODEL=gpt-4o-mini. Unset the secret → code defaults to fake/disabled (safe).
  # SQLite lives on the /data volume (durable AI budget accounting + watches).
  DATABASE_PATH = '/data/campscout.sqlite'
  # Availability watcher: in-process scheduler that polls Recreation.gov for
  # cancellations and SMS-alerts (needs the TWILIO_* secrets). Harmless with no
  # watches configured — it just idles.
  WATCHER_ENABLED = 'true'
  WATCH_POLL_INTERVAL_SECONDS = '300'

# SQLite is single-writer, so this app runs as a single stateful machine that
# stays up (never auto-stopped).
[[mounts]]
  source = 'campscout_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

  # READINESS: 200 only when SQLite opens + answers `select 1` and (WATCHER_ENABLED) the watcher
  # completed a tick within 2 x WATCH_POLL_INTERVAL_SECONDS (600s). 503 body names the failed check.
  # Fly docs: a machine failing a service check "won't be routed to until its checks start passing",
  # and "a failing check won't cause the Machine to restart". This app is ONE machine, so a failing
  # readiness check takes the whole site out of routing with no automatic recovery — which is why the
  # watcher threshold is generous. grace_period (60s = Fly's maximum; flyctl lowers anything above it)
  # covers boot: migrations run on the first getDb(),
  # and the first watcher tick lands 30s after the server binds.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
